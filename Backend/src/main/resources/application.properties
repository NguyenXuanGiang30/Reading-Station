server.port=${PORT:8080}
spring.application.name=tram-doc-api

# Profile groups
spring.profiles.group.local-mysql=local,mysql
spring.profiles.group.prod-postgres=prod,postgres
spring.profiles.group.prod-mysql=prod,mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local-mysql}

# Core persistence
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# External APIs
google.books.api.key=${GOOGLE_BOOKS_API_KEY:}
google.books.api.url=${GOOGLE_BOOKS_API_URL:https://www.googleapis.com/books/v1/volumes}

# Cross-origin
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,https://tramdoc-api.dichvu.cloud}

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.tramdoc=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.file.name=logs/tramdoc-api.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Health and docs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
app.oauth2.authorized-redirect-uris=${OAUTH2_REDIRECT_URIS:http://localhost:5173/oauth2/redirect}
oauth2.google.userinfo-url=https://www.googleapis.com/oauth2/v3/userinfo
oauth2.facebook.userinfo-url=https://graph.facebook.com/me

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App behavior
app.name=Tram Doc
app.security.swagger-enabled=${APP_SWAGGER_ENABLED:${SPRINGDOC_ENABLED:true}}
app.storage.provider=${APP_STORAGE_PROVIDER:LOCAL}
app.storage.local-directory=${APP_STORAGE_LOCAL_DIRECTORY:uploads}
app.storage.max-file-size-bytes=${APP_STORAGE_MAX_FILE_SIZE_BYTES:10485760}
app.storage.allowed-content-types=${APP_STORAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
app.storage.public-base-url=${APP_STORAGE_PUBLIC_BASE_URL:}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.region=${S3_REGION:ap-southeast-1}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.storage.s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}
app.notifications.schedule-cron=${APP_NOTIFICATION_SCHEDULE_CRON:0 * * * * *}
app.notifications.delivery-cron=${APP_NOTIFICATION_DELIVERY_CRON:15 * * * * *}

# AI / Ollama
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:3b}
ollama.timeout=${OLLAMA_TIMEOUT:60000}
